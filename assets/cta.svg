<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Open to staff and leadership roles">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B14"/><stop offset="0.5" stop-color="#12101F"/><stop offset="1" stop-color="#0A1620"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#E8C872" stop-opacity="0.2"/><stop offset="1" stop-color="#E8C872" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1200" height="220" rx="24"/></clipPath>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
  </defs>
  <g clip-path="url(#frame)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="1200" height="220" fill="url(#bg)"/>
    <ellipse cx="600" cy="100" rx="380" ry="100" fill="url(#glow)"><animate attributeName="rx" values="320;440;320" dur="5s" repeatCount="indefinite"/></ellipse>
    <rect width="1200" height="220" fill="none" stroke="#2A3550" stroke-width="2"/>

    <circle cx="120" cy="110" r="30" fill="#0B1220" stroke="#E8C872"/>
    <circle cx="120" cy="110" r="30" fill="none" stroke="#E8C872"><animate attributeName="r" values="30;46" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.6s" repeatCount="indefinite"/></circle>
    <g fill="none" stroke="#E8C872" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use xlink:href="#i-globe" x="105" y="95" width="30" height="30"/></g>

    <circle cx="1080" cy="110" r="30" fill="#0B1220" stroke="#5EEAD4"/>
    <circle cx="1080" cy="110" r="30" fill="none" stroke="#5EEAD4"><animate attributeName="r" values="30;46" dur="2.6s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/></circle>
    <g fill="none" stroke="#5EEAD4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use xlink:href="#i-mail" x="1065" y="95" width="30" height="30"/></g>

    <text x="600" y="60" text-anchor="middle" fill="#E8C872" font-size="11" letter-spacing="4" font-weight="700">AVAILABLE   /   2026</text>
    <text x="600" y="104" text-anchor="middle" fill="#F8FAFC" font-family="Georgia, Times New Roman, serif" font-size="28">Staff and leadership roles worldwide</text>
    <text x="600" y="136" text-anchor="middle" fill="#9AA8BF" font-size="14">Architecture, delivery, and people. Visa sponsorship welcome.</text>

    <rect x="404" y="160" width="180" height="36" rx="18" fill="#111827" stroke="#E8C872" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.6s" repeatCount="indefinite"/></rect>
    <text x="494" y="183" text-anchor="middle" fill="#F4D78A" font-size="11" letter-spacing="2" font-weight="700">EMAIL ME</text>
    <rect x="616" y="160" width="180" height="36" rx="18" fill="#111827" stroke="#5EEAD4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="32" dur="1.6s" repeatCount="indefinite"/></rect>
    <text x="706" y="183" text-anchor="middle" fill="#5EEAD4" font-size="11" letter-spacing="2" font-weight="700">LINKEDIN</text>
  </g>
</svg>
