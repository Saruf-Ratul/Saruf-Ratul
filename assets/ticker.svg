<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="60" viewBox="0 0 1200 60" role="img" aria-label="Technology and product ticker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#05070D"/><stop offset="0.5" stop-color="#0B1220"/><stop offset="1" stop-color="#05070D"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#05070D" stop-opacity="1"/><stop offset="0.08" stop-color="#05070D" stop-opacity="0"/><stop offset="0.92" stop-color="#05070D" stop-opacity="0"/><stop offset="1" stop-color="#05070D" stop-opacity="1"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="60" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="1200" height="60" fill="url(#bg)"/>
    <rect width="1200" height="60" fill="none" stroke="#243049" stroke-width="2"/>
    <text y="26" fill="#E8C872" font-size="12" letter-spacing="3" font-weight="700">
      C#   |   .NET   |   ASP.NET CORE   |   ANGULAR   |   REACT   |   TYPESCRIPT   |   SQL SERVER   |   ORACLE   |   AZURE   |   AWS   |   DOCKER   |   QUICKBOOKS   |   POWER BI   |   BLAZOR   |   NODE.JS   |   C#   |   .NET   |   ASP.NET CORE   |   ANGULAR   |   REACT
      <animate attributeName="x" values="40;-1500" dur="18s" repeatCount="indefinite"/>
    </text>
    <text y="46" fill="#5EEAD4" font-size="11" letter-spacing="3">
      RECRUITING PATH   |   FRANCHISE MINI ERP   |   QUICKBOOKS KPI   |   CLEARENT GATEWAY   |   TOYOTA IMS   |   FIELD SERVICE   |   PEOPLE HUB PAYROLL   |   RECRUITING PATH   |   FRANCHISE MINI ERP
      <animate attributeName="x" values="-1300;60" dur="20s" repeatCount="indefinite"/>
    </text>
    <rect width="1200" height="60" fill="url(#edge)"/>
  </g>
</svg>
