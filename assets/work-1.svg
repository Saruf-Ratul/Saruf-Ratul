<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Recruiting Path and Franchise Mini ERP">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#070B14"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <clipPath id="a"><rect x="0" y="0" width="580" height="240" rx="20"/></clipPath>
    <clipPath id="b"><rect x="620" y="0" width="580" height="240" rx="20"/></clipPath>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 20a5.2 5.2 0 0 1 6.5-4.6"/></symbol>
    <symbol id="i-build" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M8 15h2M14 15h2M10 21v-3h4v3"/></symbol>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g clip-path="url(#a)">
      <rect width="580" height="240" fill="url(#card)"/>
      <rect width="580" height="240" fill="none" stroke="#243049" stroke-width="2"/>
      <rect width="6" height="240" fill="#E8C872"/>
      <rect x="-200" width="160" height="240" fill="url(#shine)"><animate attributeName="x" values="-200;620" dur="4s" repeatCount="indefinite"/></rect>
