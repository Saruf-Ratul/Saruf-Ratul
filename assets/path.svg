<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-label="Career timeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070D"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8C872"/><stop offset="0.5" stop-color="#5EEAD4"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="370" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="1200" height="370" fill="url(#bg)"/>
    <rect width="1200" height="370" fill="none" stroke="#243049" stroke-width="2"/>
    <text x="40" y="44" fill="#E8C872" font-size="11" letter-spacing="3" font-weight="700">TIMELINE</text>
    <text x="40" y="72" fill="#F8FAFC" font-family="Georgia, Times New Roman, serif" font-size="19">Eight years from intern to Director of Engineering.</text>

    <rect x="63" y="104" width="2" height="0" fill="url(#rail)">
      <animate attributeName="height" from="0" to="236" dur="1.8s" begin="0.2s" fill="freeze"/>
    </rect>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.5s" fill="freeze"/>
      <circle cx="64" cy="118" r="6" fill="#E8C872"/>
      <circle cx="64" cy="118" r="6" fill="none" stroke="#E8C872"><animate attributeName="r" values="6;16" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="92" y="113" fill="#E8C872" font-size="10" letter-spacing="2" font-weight="700">2024 - NOW</text>
      <text x="92" y="133" fill="#F8FAFC" font-size="14" font-weight="600">Xceleran (USA)  -  Director of Engineering / Senior Staff Engineer</text>
      <text x="92" y="152" fill="#8B9BB4" font-size="12">SaaS architecture, Recruiting Path, Franchise Mini ERP, QuickBooks KPIs, team guidance</text>
      <text x="1160" y="133" fill="#6B7A94" font-size="11" letter-spacing="1.2" text-anchor="end">.NET  |  ANGULAR  |  SQL SERVER  |  AZURE</text>
    </g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze"/>
      <circle cx="64" cy="180" r="6" fill="#5EEAD4"/>
      <circle cx="64" cy="180" r="6" fill="none" stroke="#5EEAD4"><animate attributeName="r" values="6;16" dur="2.4s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
      <text x="92" y="175" fill="#5EEAD4" font-size="10" letter-spacing="2" font-weight="700">2023 - NOW</text>
      <text x="92" y="195" fill="#F8FAFC" font-size="14" font-weight="600">NAVANA Group (Toyota Bangladesh)  -  Assistant Manager, Developer</text>
      <text x="92" y="214" fill="#8B9BB4" font-size="12">Inventory and spare parts systems, vehicle booking, Crystal Reports, Power BI</text>
      <text x="1160" y="195" fill="#6B7A94" font-size="11" letter-spacing="1.2" text-anchor="end">ASP.NET  |  NODE.JS  |  SQL SERVER  |  POWER BI</text>
    </g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.3s" fill="freeze"/>
      <circle cx="64" cy="242" r="6" fill="#A78BFA"/>
      <circle cx="64" cy="242" r="6" fill="none" stroke="#A78BFA"><animate attributeName="r" values="6;16" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <text x="92" y="237" fill="#A78BFA" font-size="10" letter-spacing="2" font-weight="700">2020 - 2023</text>
      <text x="92" y="257" fill="#F8FAFC" font-size="14" font-weight="600">ERA Infotech  -  Software Engineer</text>
      <text x="92" y="276" fill="#8B9BB4" font-size="12">People Hub HR / payroll for Bank Asia, IFIC, and SBL. Oracle 12c, ASP.NET Core, Nginx deploys</text>
      <text x="1160" y="257" fill="#6B7A94" font-size="11" letter-spacing="1.2" text-anchor="end">ASP.NET CORE  |  ANGULAR  |  ORACLE</text>
    </g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.7s" fill="freeze"/>
      <circle cx="64" cy="304" r="6" fill="#F8FAFC"/>
      <circle cx="64" cy="304" r="6" fill="none" stroke="#F8FAFC"><animate attributeName="r" values="6;16" dur="2.4s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle>
      <text x="92" y="299" fill="#CBD5E1" font-size="10" letter-spacing="2" font-weight="700">2018 - 2023</text>
      <text x="92" y="319" fill="#F8FAFC" font-size="14" font-weight="600">Glo.Bu.S (Italy)  -  BitByte  -  E-Tex  -  Softech  -  Developer and Coordinator</text>
      <text x="92" y="338" fill="#8B9BB4" font-size="12">Realtime chat, ERP, e-commerce, client delivery, and first team leadership</text>
      <text x="1160" y="319" fill="#6B7A94" font-size="11" letter-spacing="1.2" text-anchor="end">REACT  |  NODE  |  MONGODB  |  SOCKET.IO</text>
    </g>
  </g>
</svg>
