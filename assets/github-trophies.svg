<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="168" viewBox="0 0 1200 168" role="img" aria-label="GitHub trophies">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070D"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="168" rx="22"/></clipPath>
    <symbol id="cup" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H5a3 3 0 0 0 3 4M17 6h2a3 3 0 0 1-3 4"/><path d="M12 14v3M8 20h8M10 20v-3h4v3"/></symbol>
  </defs>
  <g clip-path="url(#frame)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="1200" height="168" fill="url(#bg)"/>
    <rect width="1200" height="168" fill="none" stroke="#243049" stroke-width="2"/>

    <g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.05s" fill="freeze"/>
      <rect x="24" y="20" width="176" height="128" rx="16" fill="#070B14" stroke="#243049"/>
      <g fill="none" stroke="#E8C872" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use xlink:href="#cup" x="90" y="32" width="28" height="28"/></g>
      <text x="112" y="82" text-anchor="middle" fill="#E8C872" font-size="11" letter-spacing="2" font-weight="700">STARS</text>
      <text x="112" y="108" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">116</text>
      <text x="112" y="128" text-anchor="middle" fill="#8B9BB4" font-size="11">Public stars</text>
    </g>
    <g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.15s" fill="freeze"/>
      <rect x="216" y="20" width="176" height="128" rx="16" fill="#070B14" stroke="#243049"/>
      <g fill="none" stroke="#5EEAD4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use xlink:href="#cup" x="282" y="32" width="28" height="28"/></g>
      <text x="304" y="82" text-anchor="middle" fill="#5EEAD4" font-size="11" letter-spacing="2" font-weight="700">COMMITS</text>
      <text x="304" y="108" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">2,042</text>
      <text x="304" y="128" text-anchor="middle" fill="#8B9BB4" font-size="11">All-time total</text>
    </g>
    <g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.25s" fill="freeze"/>
      <rect x="408" y="20" width="176" height="128" rx="16" fill="#070B14" stroke="#243049"/>
      <g fill="none" stroke="#A78BFA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use xlink:href="#cup" x="474" y="32" width="28" height="28"/></g>
      <text x="496" y="82" text-anchor="middle" fill="#A78BFA" font-size="11" letter-spacing="2" font-weight="700">STREAK</text>
      <text x="496" y="108" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">14</text>
      <text x="496" y="128" text-anchor="middle" fill="#8B9BB4" font-size="11">Longest days</text>
    </g>
    <g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.35s" fill="freeze"/>
      <rect x="600" y="20" width="176" height="128" rx="16" fill="#070B14" stroke="#243049"/>
      <g fill="none" stroke="#34D399" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use xlink:href="#cup" x="666" y="32" width="28" height="28"/></g>
      <text x="688" y="82" text-anchor="middle" fill="#34D399" font-size="11" letter-spacing="2" font-weight="700">EXPERIENCE</text>
      <text x="688" y="108" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">7+</text>
      <text x="688" y="128" text-anchor="middle" fill="#8B9BB4" font-size="11">Years shipping</text>
    </g>
    <g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.45s" fill="freeze"/>
      <rect x="792" y="20" width="176" height="128" rx="16" fill="#070B14" stroke="#243049"/>
      <g fill="none" stroke="#F4D78A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use xlink:href="#cup" x="858" y="32" width="28" height="28"/></g>
      <text x="880" y="82" text-anchor="middle" fill="#F4D78A" font-size="11" letter-spacing="2" font-weight="700">PRS</text>
      <text x="880" y="108" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">8</text>
      <text x="880" y="128" text-anchor="middle" fill="#8B9BB4" font-size="11">Pull requests</text>
    </g>
    <g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.55s" fill="freeze"/>
      <rect x="984" y="20" width="192" height="128" rx="16" fill="#070B14" stroke="#243049"/>
      <g fill="none" stroke="#F87171" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use xlink:href="#cup" x="1056" y="32" width="28" height="28"/></g>
      <text x="1080" y="82" text-anchor="middle" fill="#F87171" font-size="11" letter-spacing="2" font-weight="700">RANK</text>
      <text x="1080" y="108" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">B-</text>
      <text x="1080" y="128" text-anchor="middle" fill="#8B9BB4" font-size="11">Public signal</text>
    </g>
  </g>
</svg>
