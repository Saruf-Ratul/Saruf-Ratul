<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Toyota Inventory Stack and Field Service Management">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#070B14"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <clipPath id="a"><rect x="0" y="0" width="580" height="240" rx="20"/></clipPath>
    <clipPath id="b"><rect x="620" y="0" width="580" height="240" rx="20"/></clipPath>
    <symbol id="i-ware" viewBox="0 0 24 24"><path d="M3 21V9.5L12 4l9 5.5V21"/><path d="M8 21v-7h8v7M12 14v7M3 21h18"/></symbol>
    <symbol id="i-truck" viewBox="0 0 24 24"><rect x="1" y="6" width="13" height="10" rx="1"/><path d="M14 9h4.5L22 12.5V16h-8z"/><circle cx="6" cy="18.5" r="2"/><circle cx="18" cy="18.5" r="2"/></symbol>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g clip-path="url(#a)">
      <rect width="580" height="240" fill="url(#card)"/>
      <rect width="580" height="240" fill="none" stroke="#243049" stroke-width="2"/>
      <rect width="6" height="240" fill="#FBBF24"/>
      <rect x="-200" width="160" height="240" fill="url(#shine)"><animate attributeName="x" values="-200;620" dur="4s" begin="0.8s" repeatCount="indefinite"/></rect>
      <text x="32" y="42" fill="#FBBF24" font-size="11" letter-spacing="2.6" font-weight="700">05   /   NAVANA  -  TOYOTA BANGLADESH</text>
      <text x="32" y="88" fill="#F8FAFC" font-family="Georgia, Times New Roman, serif" font-size="26">Toyota Inventory Stack</text>
      <text x="32" y="124" fill="#9AA8BF" font-size="14">Inter-Links IMS, sales and service, spare parts, and</text>
      <text x="32" y="146" fill="#9AA8BF" font-size="14">online vehicle booking. Stock to service in one system.</text>
      <g fill="#111827" stroke="#334155"><rect x="32" y="176" width="78" height="26" rx="13"/><rect x="118" y="176" width="70" height="26" rx="13"/><rect x="196" y="176" width="78" height="26" rx="13"/></g>
      <g fill="#E8EEF8" font-size="11" text-anchor="middle"><text x="71" y="194">ASP.NET</text><text x="153" y="194">Node.js</text><text x="235" y="194">Power BI</text></g>
      <circle cx="520" cy="64" r="28" fill="#070B14" stroke="#FBBF24"/>
      <circle cx="520" cy="64" r="28" fill="none" stroke="#FBBF24"><animate attributeName="r" values="28;42" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
      <g fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use xlink:href="#i-ware" x="506" y="50" width="28" height="28"/></g>
      <rect x="452" y="188" width="96" height="24" rx="12" fill="#0F1F19" stroke="#34D399"/>
      <circle cx="468" cy="200" r="3.5" fill="#34D399"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.5s" repeatCount="indefinite"/></circle>
      <text x="480" y="204" fill="#ECFDF5" font-size="10" letter-spacing="2" font-weight="700">LIVE</text>
    </g>

    <g clip-path="url(#b)">
      <rect x="620" width="580" height="240" fill="url(#card)"/>
      <rect x="620" width="580" height="240" fill="none" stroke="#243049" stroke-width="2"/>
      <rect x="620" width="6" height="240" fill="#38BDF8"/>
      <rect x="420" width="160" height="240" fill="url(#shine)"><animate attributeName="x" values="420;1240" dur="4s" begin="2s" repeatCount="indefinite"/></rect>
      <text x="652" y="42" fill="#38BDF8" font-size="11" letter-spacing="2.6" font-weight="700">06   /   FIELD OPERATIONS</text>
      <text x="652" y="88" fill="#F8FAFC" font-family="Georgia, Times New Roman, serif" font-size="26">Field Service Management</text>
      <text x="652" y="124" fill="#9AA8BF" font-size="14">Blazor and Azure: jobs, technicians, scheduling, and</text>
      <text x="652" y="146" fill="#9AA8BF" font-size="14">live operational views for teams working off-site.</text>
      <g fill="#111827" stroke="#334155"><rect x="652" y="176" width="66" height="26" rx="13"/><rect x="726" y="176" width="62" height="26" rx="13"/><rect x="796" y="176" width="92" height="26" rx="13"/></g>
      <g fill="#E8EEF8" font-size="11" text-anchor="middle"><text x="685" y="194">Blazor</text><text x="757" y="194">Azure</text><text x="842" y="194">SQL Server</text></g>
      <circle cx="1140" cy="64" r="28" fill="#070B14" stroke="#38BDF8"/>
      <circle cx="1140" cy="64" r="28" fill="none" stroke="#38BDF8"><animate attributeName="r" values="28;42" dur="2.4s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.4s" begin="2s" repeatCount="indefinite"/></circle>
      <g fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use xlink:href="#i-truck" x="1126" y="50" width="28" height="28"/></g>
      <rect x="1072" y="188" width="96" height="24" rx="12" fill="#0F1F19" stroke="#34D399"/>
      <circle cx="1088" cy="200" r="3.5" fill="#34D399"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <text x="1100" y="204" fill="#ECFDF5" font-size="10" letter-spacing="2" font-weight="700">LIVE</text>
    </g>
  </g>
</svg>
